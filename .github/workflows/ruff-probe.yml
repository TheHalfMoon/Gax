name: Ruff import-order probe

on:
  push:
    branches:
      - probe/sg000004-ruff-order

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Show Ruff autofix diff
        shell: bash
        run: |
          python -m ruff check --select I,UP --fix src/gaxbench/external_adapters.py tests/test_external_adapters.py || true
          git diff -- src/gaxbench/external_adapters.py tests/test_external_adapters.py
          test -z "$(git status --porcelain -- src/gaxbench/external_adapters.py tests/test_external_adapters.py)"
